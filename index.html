<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101e27" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="一間亮著暖光的便利店，一場還沒停的雨。莊的晚餐，從這個街角開始。" />
  <title>莊的晚餐｜雨夜711</title>
</head>
<body>
  <main id="app">
    <div id="scene" aria-label="雨夜便利店 3D 場景。單指旋轉，雙指縮放或平移。"></div>
    <header class="masthead">
      <div class="identity"><span class="eyebrow"><i></i> WULING · AFTER HOURS</span><h1>莊的晚餐<span>雨夜 711</span></h1></div>
      <button id="menu-toggle" class="round-button" aria-label="開啟設定" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2.5"/><circle cx="15" cy="16" r="2.5"/></svg></button>
    </header>
    <div id="loading" role="status"><div class="loading-mark">7<span>ELEVEN</span></div><p id="loading-message">正在點亮街角</p><span>等雨，也等一份熱晚餐。</span></div>
    <section id="error" hidden role="alert"><h2>街角暫時沒有亮起來</h2><p id="error-message"></p><button id="retry">重新載入</button></section>
    <aside id="settings" hidden aria-label="場景設定">
      <div class="panel-heading"><span>留一點時間，聽雨。</span><button id="menu-close" aria-label="關閉設定">×</button></div>
      <label class="setting-row" for="rain"><span>下雨</span><input id="rain" type="checkbox" checked role="switch" /></label>
      <label class="setting-row" for="sound"><span>雨聲</span><input id="sound" type="checkbox" role="switch" /></label>
      <label class="setting-row" for="characters"><span>人物預覽</span><input id="characters" type="checkbox" checked role="switch" /></label>
      <label class="setting-row" for="quality"><span>畫質</span><select id="quality"><option value="balanced">標準</option><option value="low">省電</option><option value="high">細緻</option></select></label>
      <p class="control-tip">單指旋轉。雙指縮放或平移。<br>選擇下方視角，回到街角。</p>
      <details><summary>關於這個雨夜</summary><p>第一階段：雨夜便利店場景。故事與選餐互動尚未加入。</p><p>原創二創場景。與官方無關。</p><details><summary>素材來源</summary><p>莊芳宜模型：Abcxyz51<br><a href="https://sketchfab.com/3d-models/zhuang-fangyi-arknights-endfield-51d669eb7ef94cb49aeeaf2d9541d9de" target="_blank" rel="noopener noreferrer">Sketchfab 原始頁面 ↗</a><br><a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0 ↗</a></p><p>龍泡泡與街景使用程序幾何製作。短劇為原創二創。</p></details></details>
    </aside>
    <footer class="scene-footer">
      <div class="scene-caption"><span class="chapter">01 / 雨夜街角</span><p>今晚，先在這裡停一下。</p><span class="scene-meta"><b></b> 暖燈未熄 · 晚餐待選</span></div>
      <nav class="view-dock" aria-label="相機視角">
        <button data-view="street" class="active" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-6 9 6v10H3ZM9 20v-7h6v7M3 10h18"/></svg><span>街角</span></button>
        <button data-view="store" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16v11H4ZM3 9l2-5h14l2 5M8 20v-7h8v7M8 4v5m8-5v5"/></svg><span>店前</span></button>
        <button data-view="awning" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18L18 5H6ZM5 10v10m14-10v10M9 15h6m-7 4h8"/></svg><span>屋簷</span></button>
        <button data-view="reset" aria-label="重設視角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg><span>重設</span></button>
      </nav>
      <span class="drag-hint">拖曳看街角 <span>↔</span></span>
    </footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
