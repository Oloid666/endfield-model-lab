name: Build and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/photo-camera-check.mjs
      - run: node scripts/viewer-check.mjs
      - run: node scripts/loading-check.mjs
      - run: node scripts/polish-check.mjs
      - run: node scripts/presentation-check.mjs
      - run: node scripts/bonus-check.mjs
      - run: node scripts/mission-check.mjs
      - run: node scripts/destruction-check.mjs
      - run: node scripts/cinematic-check.mjs
      - run: node scripts/props-check.mjs
      - run: node scripts/director-check.mjs
      - run: node scripts/warmup-check.mjs
      - run: node scripts/fx-check.mjs
      - run: npm run build
        env:
          VITE_BASE_PATH: /endfield-model-lab/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
