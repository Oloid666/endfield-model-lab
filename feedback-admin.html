<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>玩家回饋｜莊的晚餐</title></head>
<body><main><h1>玩家回饋</h1><p>莊的晚餐 · 僅供作者查看</p>
<form id="login"><label>管理密碼<input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" minlength="32" required></label><button type="submit">查看回饋</button><small>使用 Cloudflare 設定的管理密碼。只保留在本頁記憶體，重新整理後需再輸入。</small></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="dashboard" hidden><p id="summary"></p><div class="tools"><label>內容<select id="message-only"><option value="1">有文字意見</option><option value="">全部，包含僅星等</option></select></label><label>類型<select id="category"><option value="">全部</option><option value="general">整體感想</option><option value="praise">喜歡的地方</option><option value="bug">卡住／操作問題</option><option value="idea">想新增的內容</option></select></label><label>星等<select id="rating"><option value="">全部</option><option value="1">1 星</option><option value="2">2 星</option><option value="3">3 星</option><option value="4">4 星</option><option value="5">5 星</option></select></label><button id="refresh" type="button">重新讀取</button><button id="export" type="button">下載目前這頁 CSV</button><button id="logout" type="button">登出</button></div><div id="items"></div><button id="older" type="button" hidden>較早的回饋</button></section>
<p class="note">時間以台灣時間顯示。這裡是成功存入資料庫的回饋，與 GA4 的使用者／星等事件次數不同。</p></main><script type="module" src="/src/feedback-admin.js"></script></body></html>
