<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152b30"><title>萬噸息壤盃・手感測試</title></head><body><canvas id="game" aria-label="紫色生物拖曳龍泡泡賽道"></canvas><header><small>雨夜外傳 · PROTOTYPE 01</small><h1>萬噸息壤盃</h1><div id="stats" aria-live="off">準備出發</div></header><nav><button id="pause" disabled>暫停</button><button id="reset">重跑</button></nav><div id="impact" aria-live="polite"></div><progress id="progress" max="600" value="0" aria-label="賽程"></progress><section id="intro" class="panel"><small>711 門口出發 · 息壤高架試跑</small><h2>晚餐，拖著事故走。</h2><p>你控制紫色生物，龍泡泡在後面。<br>過彎甩出去，撞倒貨箱，別鬆開牽繩。</p><p>電腦：W／↑ 加速、A D／← → 轉向<br>S／↓ 煞車；空白鍵甩尾<br>手機：左側滑動轉向，右側按住煞車或甩尾<br>鬆開轉向回正；自動向前加速。</p><button id="start" class="gold">開始試跑</button><p class="fine">約 30–45 秒・非官方同人原型・目前無音效</p></section><section id="result" class="panel" hidden><small>試跑完成</small><h2>龍泡泡還在，貨箱不一定。</h2><p id="summary"></p><button id="again" class="gold">再甩一次</button></section><footer><div id="steer" role="slider" aria-label="左右轉向" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" tabindex="0"><span>← 滑動轉向 →</span><i></i></div><div class="pedals"><button id="brake">煞車</button><button id="drift">甩尾</button></div></footer><aside>以《部長と峠》為手感參考 · 自製測試場景 <a href="./">返回雨夜</a></aside><script type="module" src="/src/racing/main.js"></script></body></html>
